[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "scrapli==2026.2.20",
    "uvicorn==0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
