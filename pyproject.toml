[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-device-command-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "scrapli==2026.2.20",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
# jsonschema checks the generated OpenAPI response schemas independently of
# the runtime Pydantic validation.
test = [
    "pytest",
    "jsonschema",
]
# Genie is a test oracle only, never a runtime dependency (see
# docs/rsvp-parsing.md) - kept out of `test` so a normal test run
# never installs it.
genie = [
    "pyats",
    "genie",
    "genie.libs.parser",
]

[tool.setuptools.packages.find]
include = ["device_command_proxy*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
